name: document-parsing-ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install CI tools
        run: python -m pip install pytest pyyaml

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Check diff whitespace
        run: git diff --check

      - name: Validate Harness metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in (Path('.agent/config.yaml'), Path('.agent/state/workflow-state.yaml')):
              yaml.safe_load(path.read_text(encoding='utf-8'))

          required = [
              Path('.agent/main-agent.md'),
              Path('.agent/config.yaml'),
              Path('.agent/changes/README.md'),
              Path('.agent/memory/README.md'),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f'Missing Harness files: {missing}')
          print('Harness metadata OK')
          PY

      - name: Run tests when present
        shell: bash
        run: |
          if find . -maxdepth 3 -type f \( -name 'test_*.py' -o -name '*_test.py' \) | grep -q .; then
            python -m pytest -q
          else
            echo 'No repository tests found; compile and metadata checks completed.'
          fi
